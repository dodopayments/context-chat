name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (worker)
        run: npm run typecheck

      - name: Typecheck (widget)
        run: npx tsc --noEmit -p widget/tsconfig.json

      - name: Test
        run: npm test

      - name: Build widget bundle
        run: npm run build:widget

      - name: Assert widget bundle has no dynamic imports
        run: |
          count=$(grep -c 'import(' widget/dist/widget.js || true)
          echo "dynamic import() occurrences: $count"
          if [ "$count" -ne 0 ]; then
            echo "::error::widget bundle contains dynamic import() -- breaks the single self-contained IIFE served into the Shadow DOM"
            exit 1
          fi
